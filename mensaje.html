<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mensaje especial</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="overlay">
    <div class="container">
      <header class="header">
        <h1 class="title glow">Mensaje especial</h1>
      </header>
      <section class="card">
        <p>Hay alguien que os ha querido mandar un mensaje. Pulsa el botón para escucharlo.</p>
        <div class="actions">
          <button class="button" id="play-message">Reproducir mensaje</button>
        </div>
        <div id="player-wrap" style="display:none; margin-top:1rem; text-align:center">
          <audio id="mensaje-audio" src="mensaje.mp3" preload="auto" controls></audio>
        </div>
      </section>
      <p class="footer"><a href="index.html" class="button small">Volver</a></p>
    </div>
  </div>
  <script>
    document.getElementById('play-message').addEventListener('click', () => {
      document.getElementById('player-wrap').style.display = 'block';
      document.getElementById('mensaje-audio').play();
    });
  </script>
</body>
</html>
